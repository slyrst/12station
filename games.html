<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>12STATION - Games</title>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    font-size:10pt;
    background:#EEF2FF;
    color:#000;
    padding:5px;
    margin:0;
}


a{
    color:#000080;
    text-decoration:none;
}


#header{
    position:absolute;
    top:5px;
    left:5px;
    right:5px;
    font-size:9pt;
}


#navtop{
    float:left;
}


#navtopr{
    float:right;
}


.logo{
    clear:both;
    text-align:center;
    padding-top:40px;
    color:#000080;
}


.logo span{
    font-size:30px;
    font-weight:bold;
    letter-spacing:-2px;
}


.logo small{
    display:block;
    font-size:11px;
    color:#667788;
}



.station{

    width:468px;
    max-width:100%;
    margin:25px auto;
    background:#D6DAF0;
    border:1px solid #8899AA;
    padding:10px;
    box-sizing:border-box;

}



.postblock{

    background:#B7C5D9;
    border:1px solid #8899AA;
    padding:5px;
    font-weight:bold;

}



.content{

    background:#EEF2FF;
    padding:10px;

}



.game{

    background:#D6DAF0;
    border:1px solid #8899AA;
    padding:10px;
    margin-bottom:10px;

}



.game-title{

    font-weight:bold;
    color:#000080;

}



.button{

    display:inline-block;
    background:#B7C5D9;
    border:1px solid #667788;
    padding:5px 12px;
    margin-top:10px;

}


.button:hover{

    background:#C9D4E5;
    color:#DD0000;

}



.footer{

    text-align:center;
    color:#667788;
    margin-top:30px;

}


</style>

</head>


<body>


<div id="header">


<div id="navtop">

<a href="index.html">
[Home]
</a>

<a href="games.html">
[Games]
</a>

</div>



<div id="navtopr">

<a href="#" onclick="logout();return false;">
[Reset Device]
</a>

</div>


</div>





<div class="logo">

<span>12STATION</span>

<small>
the game station
</small>

</div>







<div class="station">


<div class="postblock">

GAME STATION

</div>



<div class="content">


Welcome back to 12STATION.


<br><br>





<div class="game">


<div class="game-title">

click simulator

</div>


<br>


a game where u only click


<br>


<a class="button" href="clicksimulator.html">

PLAY

</a>


</div>







<div class="game">


<div class="game-title">

multiplayer game

</div>


<br>


play with your friends in a multiplayer world.


<br>


<a class="button" href="multiplayergame.html">

PLAY

</a>


</div>





</div>


</div>







<div class="footer">

12STATION © 2026

</div>







<script>


let device = localStorage.getItem("12station_device");


if(!device){

    alert("No registered device detected.");

    window.location.href="index.html";

}



function logout(){

    if(confirm("Remove device registration?")){

        localStorage.removeItem("12station_device");

        window.location.href="index.html";

    }

}


</script>





</body>
</html>
